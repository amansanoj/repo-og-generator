<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="NrnZ8xzyO1ENanJHP7rB2nRHKAQXz9tc2atU9DNNCHM" />
  <meta property="og:title" content="Repo OG Generator" />
  <meta property="og:description" content="Create custom social media preview cards for your open-source projects in seconds." />
  <meta property="og:image" content="https://repo-og-generator.vercel.app/og-home.png" />
  <meta property="og:url" content="https://repo-og-generator.vercel.app" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://repo-og-generator.vercel.app/og-home.png" />
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@amansanoj/brand/globals.css" />
  <title>Repo OG Generator</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/js/all.min.js" defer></script>

  <style>
    :root {
      --background: #fafafa;
      --foreground: #1a1a1a;
      --border: #e6e6e6;
      --input: #e6e6e6;
      --ring: #3d8fd1;
      --muted: #f2f2f2;
      --muted-foreground: #666666;
      --primary: #3d8fd1;
      --primary-foreground: #fafafa;
      --primary-light: #5a9fd8;
      --secondary: #f0af7a;
      --secondary-foreground: #1a1a1a;
      --accent: #a99f6a;
      --accent-foreground: #1a1a1a;
      --radius: 0.5rem;
    }

    .dark, :root.dark, [data-theme="dark"] {
      --background: #1a1a1a;
      --foreground: #fafafa;
      --border: #333333;
      --input: #333333;
      --ring: #3d8fd1;
      --muted: #262626; 
      --muted-foreground: #999999;
      --primary: #3d8fd1;
      --primary-foreground: #fafafa;
      --primary-light: #5a9fd8;
      --secondary: #f0af7a;
      --secondary-foreground: #1a1a1a;
      --accent: #a99f6a;
      --accent-foreground: #1a1a1a;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
            muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
            primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)', light: 'var(--primary-light)' },
            secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
            accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
          },
          fontFamily: {
            display: ['Instrument Sans', 'sans-serif'],
            body: ['Geist', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .range-slider {
        @apply w-full h-1 bg-secondary rounded-full appearance-none cursor-pointer outline-none;
      }
      .range-slider::-webkit-slider-thumb {
        @apply appearance-none w-5 h-5 rounded-full bg-primary border-2 border-background ring-1 ring-primary transition-transform duration-150 hover:scale-110;
      }
    }
  </style>

  <script>
    (() => {
      const media = window.matchMedia('(prefers-color-scheme: dark)')
      const applyTheme = (isDark) => {
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      }
      applyTheme(media.matches)
      if (media.addEventListener) {
        media.addEventListener('change', (event) => applyTheme(event.matches))
      } else if (media.addListener) {
        media.addListener((event) => applyTheme(event.matches))
      }
    })()
  </script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>

<body class="bg-background text-foreground min-h-screen flex flex-col items-center pt-16 px-5 pb-20 font-body antialiased leading-normal">
  <div class="w-full max-w-3xl flex flex-col gap-10">
    
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <h1 class="text-5xl font-semibold font-display tracking-normal">Repo OG Generator</h1>
        <a href="https://github.com/amansanoj/repo-og-generator" target="_blank" rel="noopener" class="text-muted-foreground hover:text-secondary transition-colors duration-200 flex items-center" aria-label="GitHub">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.9rem" height="1.9rem" fill="currentColor" viewBox="0 0 256 256"><path d="M208,104v8a48,48,0,0,1-48,48H136a32,32,0,0,1,32,32v40H104V192a32,32,0,0,1,32-32H112a48,48,0,0,1-48-48v-8a49.28,49.28,0,0,1,8.51-27.3A51.92,51.92,0,0,1,76,32a52,52,0,0,1,43.83,24h32.34A52,52,0,0,1,196,32a51.92,51.92,0,0,1,3.49,44.7A49.28,49.28,0,0,1,208,104Z" opacity="0.2"></path><path d="M208.3,75.68A59.74,59.74,0,0,0,202.93,28,8,8,0,0,0,196,24a59.75,59.75,0,0,0-48,24H124A59.75,59.75,0,0,0,76,24a8,8,0,0,0-6.93,4,59.78,59.78,0,0,0-5.38,47.68A58.14,58.14,0,0,0,56,104v8a56.06,56.06,0,0,0,48.44,55.47A39.8,39.8,0,0,0,96,192v8H72a24,24,0,0,1-24-24A40,40,0,0,0,8,136a8,8,0,0,0,0,16,24,24,0,0,1,24,24,40,40,0,0,0,40,40H96v16a8,8,0,0,0,16,0V192a24,24,0,0,1,48,0v40a8,8,0,0,0,16,0V192a39.8,39.8,0,0,0-8.44-24.53A56.06,56.06,0,0,0,216,112v-8A58,58,0,0,0,208.3,75.68ZM200,112a40,40,0,0,1-40,40H112a40,40,0,0,1-40-40v-8a41.74,41.74,0,0,1,6.9-22.48A8,8,0,0,0,80,73.83a43.81,43.81,0,0,1,.79-33.58,43.88,43.88,0,0,1,32.32,20.06A8,8,0,0,0,119.82,64h32.35a8,8,0,0,0,6.74-3.69,43.87,43.87,0,0,1,32.32-20.06A43.81,43.81,0,0,1,192,73.83a8.09,8.09,0,0,0,1,7.65A41.76,41.76,0,0,1,200,104Z"></path></svg>
        </a>
      </div>
      <p class="text-xl text-muted-foreground">Create custom social media preview cards for your open-source projects in seconds.</p>
    </div>

    <div class="form flex flex-col gap-6">
      
      <div role="group" class="field">
        <label for="reponame" class="text-base font-semibold">Repository Name</label>
        <input id="reponame" type="text" placeholder="e.g., awesome-repo" class="input h-12 bg-muted border border-transparent focus:border-primary text-base px-4 outline-none transition-colors placeholder:text-muted-foreground/70" />
      </div>
      
      <div role="group" class="field">
        <label for="description" class="text-base font-semibold">Project Description</label>
        <textarea id="description" placeholder="What makes your project special? Write a catchy one-liner here..." class="textarea bg-muted border border-transparent focus:border-primary text-base p-4 min-h-[120px] outline-none transition-colors placeholder:text-muted-foreground/70"></textarea>
      </div>
      
      <div class="flex flex-col sm:flex-row gap-6 sm:gap-4">
        <div role="group" class="field flex-1">
          <label for="url" class="text-base font-semibold">Website URL <span class="font-medium text-accent ml-1 text-sm">optional</span></label>
          <input id="url" type="text" placeholder="e.g., yourwebsite.com" class="input h-12 bg-muted border border-transparent focus:border-primary text-base px-4 outline-none transition-colors placeholder:text-muted-foreground/70" />
        </div>
        
        <div role="group" class="field flex-1">
          <label id="variant-label" class="text-base font-semibold">Design Style</label>
          <div class="flex gap-2" id="variant-options" role="radiogroup" aria-labelledby="variant-label"></div>
        </div>
      </div>
      
      <div role="group" class="field">
        <div class="flex justify-between items-center mb-2">
          <label for="scale" class="m-0 text-base font-semibold">Zoom Scale</label>
          <span class="text-base text-accent font-semibold" id="scale-label">1×</span>
        </div>
        <input id="scale" type="range" min="0.1" max="3" step="0.1" value="1" class="range-slider" />
      </div>
      
      <button class="btn bg-primary hover:bg-primary-light text-primary-foreground border border-primary w-full h-12 mt-2 text-lg font-semibold transition-colors" id="generate-btn" type="button">Generate Preview</button>
    </div>

    <div class="hidden flex-col gap-4 border-t border-border pt-8 mt-2" id="preview-wrap">
      <img id="preview-img" src="" alt="OG Preview" class="w-full h-auto rounded-lg border border-border bg-muted" />
      
      <div class="flex items-center gap-3 bg-muted border border-border rounded-md py-2.5 pr-2.5 pl-4">
        <span class="flex-1 text-base text-foreground overflow-hidden text-ellipsis whitespace-nowrap" id="url-box"></span>
        <button class="btn bg-secondary hover:opacity-90 text-secondary-foreground border border-secondary shrink-0 transition-opacity text-sm px-4" id="copy-btn" type="button">Copy Link</button>
      </div>
    </div>
  </div>

  <script>
    const scaleSlider = document.getElementById('scale');
    const scaleLabel = document.getElementById('scale-label');

    const updateSlider = (el) => {
      const min = parseFloat(el.min || 0);
      const max = parseFloat(el.max || 100);
      const value = parseFloat(el.value);
      const percent = (max === min) ? 0 : ((value - min) / (max - min)) * 100;
      el.style.setProperty('--slider-value', `${percent}%`);
    };

    updateSlider(scaleSlider);
    scaleSlider.addEventListener('input', (e) => {
      updateSlider(e.target);
      scaleLabel.textContent = e.target.value + '×';
    });

    async function loadVariants() {
      const container = document.getElementById('variant-options')
      try {
        const response = await fetch('/api/config')
        const config = await response.json()
        
        container.innerHTML = config.variants
          .map((variant, index) => {
            const checked = index === 0 ? ' checked' : ''
            return `
              <div class="relative flex-1 flex">
                <input type="radio" name="variant" id="variant-${index}" class="peer hidden" value="${variant.value}"${checked} />
                <label for="variant-${index}" class="flex flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-transparent bg-muted h-12 px-4 text-base font-medium transition-colors hover:bg-muted/80 peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:border-primary">
                  ${variant.label}
                </label>
              </div>
            `
          })
          .join('')
      } catch {
        container.innerHTML = `
          <div class="relative flex-1 flex">
            <input type="radio" name="variant" id="variant-fallback" class="peer hidden" value="primary" checked />
            <label for="variant-fallback" class="flex flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-transparent bg-muted h-12 px-4 text-base font-medium transition-colors hover:bg-muted/80 peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:border-primary">
              Default Style
            </label>
          </div>
        `
      }
    }

    function buildUrl() {
      const reponame = document.getElementById('reponame').value.trim() || 'awesome-repo'
      const description = document.getElementById('description').value.trim()
      const url = document.getElementById('url').value.trim()
      const variantInput = document.querySelector('input[name=variant]:checked')
      const variant = variantInput ? variantInput.value : 'primary'
      const scale = document.getElementById('scale').value
      const params = new URLSearchParams()
      if (description) params.set('description', description)
      if (url) params.set('url', url)
      if (variant !== 'primary') params.set('variant', variant)
      if (scale !== '1') params.set('scale', scale)
      const query = params.toString().split('+').join('%20')
      return query ? '/' + encodeURIComponent(reponame) + '?' + query : '/' + encodeURIComponent(reponame)
    }

    function generate() {
      const u = buildUrl()
      const wrap = document.getElementById('preview-wrap')
      const img = document.getElementById('preview-img')
      const box = document.getElementById('url-box')
      img.src = u + (u.includes('?') ? '&' : '?') + 't=' + Date.now()
      box.textContent = window.location.origin + u
      wrap.style.display = 'flex'
    }

    function copyUrl() {
      const text = document.getElementById('url-box').textContent
      const btn = document.getElementById('copy-btn')
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!'
        
        btn.classList.replace('bg-secondary', 'bg-accent') 
        btn.classList.replace('border-secondary', 'border-accent') 
        btn.classList.replace('text-secondary-foreground', 'text-accent-foreground') 
        
        setTimeout(() => {
          btn.textContent = 'Copy Link'
          btn.classList.replace('bg-accent', 'bg-secondary')
          btn.classList.replace('border-accent', 'border-secondary') 
          btn.classList.replace('text-accent-foreground', 'text-secondary-foreground') 
        }, 1500)
      })
    }

    document.getElementById('generate-btn').addEventListener('click', generate)
    document.getElementById('copy-btn').addEventListener('click', copyUrl)
    
    loadVariants()
  </script>
</body>
</html>
