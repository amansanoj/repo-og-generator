  <title>Repo OG Generator</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link href="./style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@amansanoj/brand@2.0.1/globals.css">

  <script>
    (() => {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
      
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
</head>

<body class="bg-background text-foreground min-h-screen flex flex-col items-center pt-16 px-5 pb-20 font-body antialiased leading-normal">
  <div class="w-full max-w-4xl flex flex-col gap-10">
    
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <h1 class="text-5xl font-semibold font-display tracking-normal">Repo OG Generator</h1>
        
        <div class="flex items-center gap-5">
          <button id="theme-toggle" type="button" class="text-muted-foreground hover:text-secondary transition-colors duration-200 flex items-center" aria-label="Toggle Dark Mode">
            <svg id="theme-toggle-light-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="2rem" height="2rem" fill="currentColor" viewBox="0 0 256 256">

            </svg>
            <svg id="theme-toggle-dark-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="2rem" height="2rem" fill="currentColor" viewBox="0 0 256 256">
              <path d="M227.89,147.89A96,96,0,1,1,108.11,28.11,96.09,96.09,0,0,0,227.89,147.89Z" opacity="0.2"></path><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"></path>
            </svg>
          </button>
          
          <a href="https://github.com/amansanoj/repo-og-generator" target="_blank" rel="noopener" class="text-muted-foreground hover:text-secondary transition-colors duration-200 flex items-center" aria-label="GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="2rem" height="2rem" fill="currentColor" viewBox="0 0 256 256"><path d="M208,104v8a48,48,0,0,1-48,48H136a32,32,0,0,1,32,32v40H104V192a32,32,0,0,1,32-32H112a48,48,0,0,1-48-48v-8a49.28,49.28,0,0,1,8.51-27.3A51.92,51.92,0,0,1,76,32a52,52,0,0,1,43.83,24h32.34A52,52,0,0,1,196,32a51.92,51.92,0,0,1,3.49,44.7A49.28,49.28,0,0,1,208,104Z" opacity="0.2"></path><path d="M208.3,75.68A59.74,59.74,0,0,0,202.93,28,8,8,0,0,0,196,24a59.75,59.75,0,0,0-48,24H124A59.75,59.75,0,0,0,76,24a8,8,0,0,0-6.93,4,59.78,59.78,0,0,0-5.38,47.68A58.14,58.14,0,0,0,56,104v8a56.06,56.06,0,0,0,48.44,55.47A39.8,39.8,0,0,0,96,192v8H72a24,24,0,0,1-24-24A40,40,0,0,0,8,136a8,8,0,0,0,0,16,24,24,0,0,1,24,24,40,40,0,0,0,40,40H96v16a8,8,0,0,0,16,0V192a24,24,0,0,1,48,0v40a8,8,0,0,0,16,0V192a39.8,39.8,0,0,0-8.44-24.53A56.06,56.06,0,0,0,216,112v-8A58,58,0,0,0,208.3,75.68ZM200,112a40,40,0,0,1-40,40H112a40,40,0,0,1-40-40v-8a41.74,41.74,0,0,1,6.9-22.48A8,8,0,0,0,80,73.83a43.81,43.81,0,0,1,.79-33.58,43.88,43.88,0,0,1,32.32,20.06A8,8,0,0,0,119.82,64h32.35a8,8,0,0,0,6.74-3.69,43.87,43.87,0,0,1,32.32-20.06A43.81,43.81,0,0,1,192,73.83a8.09,8.09,0,0,0,1,7.65A41.76,41.76,0,0,1,200,104Z"></path></svg>
          </a>
        </div>
      </div>
      <p class="text-xl text-muted-foreground">Create custom social media preview cards for your open-source projects in seconds.</p>
    </div>

    <div class="form flex flex-col gap-6">
      
      <div role="group" class="field">
        <label for="reponame" class="text-base font-semibold">Repository Name</label>
        <input id="reponame" type="text" placeholder="e.g., awesome-repo" class="input h-12 bg-muted border border-transparent focus:border-primary text-base px-4 outline-none transition-colors placeholder:text-muted-foreground/70" />
      </div>
      
      <div role="group" class="field">
        <label for="description" class="text-base font-semibold">Project Description</label>
        <textarea id="description" placeholder="What makes your project special? Write a catchy one-liner here..." class="textarea bg-muted border border-transparent focus:border-primary text-base p-4 min-h-[120px] outline-none transition-colors placeholder:text-muted-foreground/70"></textarea>
      </div>
      
      <div class="flex flex-col sm:flex-row gap-6 sm:gap-4 items-end">
        
        <div role="group" class="field w-full sm:flex-1 flex flex-col justify-end">
          <label for="url" class="block text-base font-semibold ">Website URL <span class="font-medium text-accent ml-1 text-sm">optional</span></label>
          <input id="url" type="text" placeholder="e.g., yourwebsite.com" class="input w-full h-12 bg-muted border border-transparent focus:border-primary text-base px-4 outline-none transition-colors placeholder:text-muted-foreground/70" />
        </div>
        
        <div role="group" class="field w-full sm:flex-1 flex flex-col justify-end">
          <label id="variant-label" class="block text-base font-semibold ">Design Style</label>
          <div class="flex gap-2 h-12" id="variant-options" role="radiogroup" aria-labelledby="variant-label"></div>
        </div>

      </div>
      
      <div role="group" class="field">
        <div class="flex justify-between items-center ">
          <label for="scale" class="m-0 text-base font-semibold">Zoom Scale</label>
          <span class="text-base text-accent font-semibold" id="scale-label">1×</span>
        </div>
        <input id="scale" type="range" min="0.1" max="3" step="0.1" value="1" class="range-slider" />
      </div>
      
        <button class="btn w-full h-12 mt-2 text-lg font-semibold transition-colors border border-primary bg-primary hover:bg-primary-light hover:border-primary-light hover:text-foreground" id="generate-btn" type="button">
            Generate Preview
        </button>
    </div>

    <div class="hidden flex-col gap-4 border-t border-border pt-8 mt-2" id="preview-wrap">
      <img id="preview-img" src="" alt="OG Preview" class="w-full h-auto rounded-lg border border-border bg-muted" />
      
      <div class="flex items-center gap-3 bg-muted border border-border rounded-md py-2.5 pr-2.5 pl-4">
        <span class="flex-1 text-base text-foreground overflow-hidden text-ellipsis whitespace-nowrap" id="url-box"></span>
        <button class="btn bg-secondary hover:opacity-90 text-secondary-foreground border border-secondary shrink-0 transition-opacity text-sm px-4" id="copy-btn" type="button">Copy Link</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/js/all.min.js" defer></script>

  <script>
    // --- Slider UI Logic ---
    const scaleSlider = document.getElementById('scale');
    const scaleLabel = document.getElementById('scale-label');

    const updateSlider = (el) => {
      const min = parseFloat(el.min || 0);
      const max = parseFloat(el.max || 100);
      const value = parseFloat(el.value);
      const percent = (max === min) ? 0 : ((value - min) / (max - min)) * 100;
      el.style.setProperty('--slider-value', `${percent}%`);
    };

    updateSlider(scaleSlider);
    scaleSlider.addEventListener('input', (e) => {
      updateSlider(e.target);
      scaleLabel.textContent = e.target.value + '×';
    });

    // --- Data Fetching & Generation ---
    async function loadVariants() {
      const container = document.getElementById('variant-options')
      try {
        const response = await fetch('/api/config')
        const config = await response.json()
        
        container.innerHTML = config.variants
          .map((variant, index) => {
            const checked = index === 0 ? ' checked' : ''
            return `
              <div class="relative flex-1 flex">
                <input type="radio" name="variant" id="variant-${index}" class="peer hidden" value="${variant.value}"${checked} />
                <label for="variant-${index}" class="flex flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-border bg-background h-12 px-4 text-base font-medium text-muted-foreground transition-colors hover:bg-muted hover:text-foreground peer-checked:border-primary peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:hover:bg-primary-light peer-checked:hover:border-primary-light">
                  ${variant.label}
                </label>
              </div>
            `
          })
          .join('')
      } catch {
        // Fallback UI
        container.innerHTML = `
          <div class="relative flex-1 flex">
            <input type="radio" name="variant" id="variant-fallback" class="peer hidden" value="primary" checked />
            <label for="variant-fallback" class="flex flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-border bg-background h-12 px-4 text-base font-medium text-muted-foreground transition-colors hover:bg-muted hover:text-foreground peer-checked:border-primary peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:hover:bg-primary-light peer-checked:hover:border-primary-light">
              Default Style
            </label>
          </div>
        `
      }
    }

    function buildUrl() {
      const reponame = document.getElementById('reponame').value.trim() || 'awesome-repo'
      const description = document.getElementById('description').value.trim()
      const url = document.getElementById('url').value.trim()
      const variantInput = document.querySelector('input[name=variant]:checked')
      const variant = variantInput ? variantInput.value : 'primary'
      const scale = document.getElementById('scale').value
      const params = new URLSearchParams()
      if (description) params.set('description', description)
      if (url) params.set('url', url)
      if (variant !== 'primary') params.set('variant', variant)
      if (scale !== '1') params.set('scale', scale)
      const query = params.toString().split('+').join('%20')
      return query ? '/' + encodeURIComponent(reponame) + '?' + query : '/' + encodeURIComponent(reponame)
    }

    function generate() {
      const u = buildUrl()
      const wrap = document.getElementById('preview-wrap')
      const img = document.getElementById('preview-img')
      const box = document.getElementById('url-box')
      img.src = u + (u.includes('?') ? '&' : '?') + 't=' + Date.now()
      box.textContent = window.location.origin + u
      wrap.style.display = 'flex'
    }

    function copyUrl() {
      const text = document.getElementById('url-box').textContent
      const btn = document.getElementById('copy-btn')
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!'
        
        btn.classList.replace('bg-secondary', 'bg-accent') 
        btn.classList.replace('border-secondary', 'border-accent') 
        btn.classList.replace('text-secondary-foreground', 'text-accent-foreground') 
        
        setTimeout(() => {
          btn.textContent = 'Copy Link'
          btn.classList.replace('bg-accent', 'bg-secondary')
          btn.classList.replace('border-accent', 'border-secondary') 
          btn.classList.replace('text-accent-foreground', 'text-secondary-foreground') 
        }, 1500)
      })
    }

    document.getElementById('generate-btn').addEventListener('click', generate)
    document.getElementById('copy-btn').addEventListener('click', copyUrl)
    
    loadVariants()

    // --- Theme Toggle Logic ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    if (document.documentElement.classList.contains('dark')) {
      lightIcon.classList.remove('hidden'); 
    } else {
      darkIcon.classList.remove('hidden'); 
    }

    // The actual theme switching logic
    const executeThemeSwap = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      
      if (isDark) {
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      } else {
        lightIcon.classList.add('hidden');
        darkIcon.classList.remove('hidden');
      }
    };

    themeToggleBtn.addEventListener('click', () => {
      // If the browser supports View Transitions, do the smooth crossfade
      if (document.startViewTransition) {
        document.startViewTransition(executeThemeSwap);
      } else {
        // Fallback for older browsers
        executeThemeSwap();
      }
    });

  </script>
</body>
</html>
